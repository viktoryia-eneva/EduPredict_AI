<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>EduPredict AI</title>
    </head>

    <body>
        <h1>EduPredict AI</h1>
        <p>Enter student information to estimate dropout risk.</p>

        <form method="POST" action="/predict">
            <label>Age at enrollment:</label>
            <input type="number" name="age" required>

            <br><br>

            <label>Admission grade:</label>
            <input type="number" step="0.01" name="admission_grade" required>

            <br><br>

            <label>First semester approved units:</label>
            <input type="number" name="approved_units" required>

            <br><br>

            <label>First semester grade:</label>
            <input type="number" step="0.01" name="first_sem_grade" required>

            <br><br>

            <button type="submit">Predict dropout risk</button>
        </form>
    </body>
</html>
